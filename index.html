<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login W1 Consultoria</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="login-box">
      <div class="form-container">
        <h2 class="titulo">Entre na sua conta</h2>
        <input type="text" placeholder="Usuário" class="input" />
        <input type="password" placeholder="Senha do Usuário" class="input" />
        <button class="btn">Login</button>
        <p class="cadastro">Ainda não tem uma conta? <a href="#">Registrar-se</a></p>
      </div>
      <div class="texto-lateral">
        <p class="texto-digitando"></p>
      </div>
    </div>
    <div class="logo">
      <img src="i1.jpeg" alt="Logo W1 Consultoria" />
    </div>
  </div>

  <!-- Botões de Acessibilidade -->
  <div class="acessibilidade-container">
    <button class="btn-acessibilidade" id="aumentarFonte">A+</button>
    <button class="btn-acessibilidade" id="atalhosAcessibilidade">Atalhos</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
