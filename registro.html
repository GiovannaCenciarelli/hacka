<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registre-se</title>
  <link rel="stylesheet" href="style2.css" />
</head>
<body>
  <div class="card">
    <h2>Crie sua conta</h2>
    <p class="subtitle">Crie sua conta e tenha acesso completo a nossa consultoria patrimonial.</p>
    <form class="form">
      <div class="row">
        <div class="input-group">
          <input type="text" id="firstname" placeholder="Nome" required />
        </div>
        <div class="input-group">
          <input type="text" id="lastname" placeholder="Sobrenome" required />
        </div>
      </div>
      <div class="input-group">
        <input type="email" id="email" placeholder="Email" required />
      </div>
      <div class="input-group password-group">
        <input type="password" id="password" placeholder="Senha" required />
        <span class="toggle-visibility" data-target="password">
          <!-- simples ícone SVG de olho -->
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#888" d="M12,4.5C7,4.5 2.73,7.61 1,12C2.73,16.39 7,19.5 12,19.5C17,19.5 21.27,16.39 23,12C21.27,7.61 17,4.5 12,4.5M12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17M12,9.5A2.5,2.5 0 0,0 9.5,12A2.5,2.5 0 0,0 12,14.5A2.5,2.5 0 0,0 14.5,12A2.5,2.5 0 0,0 12,9.5Z" />
          </svg>
        </span>
      </div>
      <div class="input-group password-group">
        <input type="password" id="confirm" placeholder="Confirme sua senha" required />
        <span class="toggle-visibility" data-target="confirm">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#888" d="M12,4.5C7,4.5 2.73,7.61 1,12C2.73,16.39 7,19.5 12,19.5C17,19.5 21.27,16.39 23,12C21.27,7.61 17,4.5 12,4.5M12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17M12,9.5A2.5,2.5 0 0,0 9.5,12A2.5,2.5 0 0,0 12,14.5A2.5,2.5 0 0,0 14.5,12A2.5,2.5 0 0,0 12,9.5Z" />
          </svg>
        </span>
      </div>
      <button type="submit" class="btn">Inscrever-se</button>
    </form>
    <p class="foot">Já tem uma conta? <a href="index.html">Entrar</a></p>
  </div>

  <script src="registro.js"></script>
</body>
</html>
